# One-pass CPT over every dataset/cpt/*/train.jsonl dataset.
# Embeddings and lm_head stay frozen; LoRA is attached to the selected blocks.
recipe:
  name: cpt-all-r64
  stage: cpt
  base_model: ornith-ai/Ornith-1.5-9B
  adapter: ""
  seed: 3407
  max_seq_length: 4096
  load_in_4bit: true
  text_only: true

hyperparams:
  epochs: 1
  batch_size: 1
  grad_acc: 10
  lr: 5.0e-5
  embed_lr: 0
  optimizer: adamw_8bit
  scheduler: linear
  warmup_steps: 5
  weight_decay: 1.0e-3
  save_steps: 100
  do_eval: false
  lora_rank: 64
  lora_alpha: 32
  lora_dropout: 0
  rslora: true
  bias: none
  grad_checkpt: unsloth
  packing: true
  target_module:
    - gate_proj
    - up_proj
    - q_proj
    - down_proj
    - o_proj

mixing:
  strategy: concat

datasets:
  - name: "*"
