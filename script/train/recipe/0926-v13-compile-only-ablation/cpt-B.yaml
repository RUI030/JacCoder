# v1.3 ablation, run B: identical to A plus Nitin-osp-compile-only (9.9M tokens
# of compile-only OSP, placed before the tested OSP set), then the shared SFT.
# Compare A vs B on the test sets. B trains ~2x the CPT tokens (more steps).
recipe:
  name: v13B-cpt-r64-seq
  stage: cpt
  base_model: unsloth/Qwen3-Coder-30B-A3B-Instruct
  adapter: ""
  out_dir: output/adapter/0926-v13/B/cpt
  seed: 3407
  max_seq_length: 4096
  load_in_4bit: true
  text_only: true

hyperparams:
  epochs: 1
  batch_size: 1
  grad_acc: 10
  lr: 5.0e-5
  embed_lr: 0
  optimizer: adamw_8bit
  scheduler: linear
  warmup_steps: 5
  weight_decay: 1.0e-3
  save_steps: 100
  save_total_limit: 2           # r64 checkpoints are ~15GB each
  do_eval: false
  lora_rank: 64
  lora_alpha: 32
  lora_dropout: 0
  rslora: true
  bias: none
  grad_checkpt: unsloth
  packing: true
  target_module:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

mixing:
  strategy: sequential

# Ordered basic -> advanced. Reorder here to change the curriculum.
datasets:
  - name: Ayush-JacDocs-26Sept
  - name: Nitin-composer-fn
  - name: Nitin-js2jac
  - name: Nitin-farm
  - name: Nitin-jachacks
  - name: Nitin-osp-compile-only
  - name: Nitin-osp
  - name: Rui-jacapp-4
