training:
  max_seq_length: 16384
  num_epochs: 3
  learning_rate: 0.00005
  embedding_learning_rate: null
  batch_size: 1
  gradient_accumulation_steps: 10
  warmup_steps: 5
  max_steps: 0
  save_steps: 100
  eval_steps: 0.1
  weight_decay: 0.001
  random_seed: 3407
  packing: false
  train_on_completions: false
  gradient_checkpointing: unsloth
  optim: adamw_8bit
  lr_scheduler_type: linear
lora:
  lora_r: 128
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - embed_tokens
    - lm_head
  use_rslora: true
  use_loftq: false
  use_dora: false
logging:
  enable_wandb: false
  wandb_project: llm-finetuning
  enable_tensorboard: false
  tensorboard_dir: runs
  log_frequency: 10